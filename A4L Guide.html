<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A4L - Soul Awakening Guide Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
  /* -- Reset -- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* -- App Shell -- */
  body {
    font-family: 'Cormorant Garamond', Georgia, serif;
    background: #1a1410;
    min-height: 100vh;
    padding: 32px 16px 60px;
    color: #eee;
  }

  /* -- Control Panel -- */
  .control-panel {
    max-width: 620px;
    margin: 0 auto 36px;
    text-align: center;
  }

  .app-logo {
    font-family: 'Parisienne', cursive;
    font-size: 52px;
    color: #c8a050;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(200,160,80,0.3);
  }

  .app-org {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: #a08040;
    margin-top: 4px;
  }

  .app-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 15px;
    color: #8a6a30;
    margin-top: 5px;
  }

  .gold-line {
    width: 220px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c8a050, transparent);
    margin: 14px auto;
  }

  .input-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(200,160,80,0.25);
    border-radius: 12px;
    padding: 24px 28px;
    margin-top: 20px;
  }

  .input-card h2 {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: #c8a050;
    margin-bottom: 18px;
  }

  .input-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  input[type="text"] {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(200,160,80,0.2);
    border-radius: 7px;
    padding: 11px 15px;
    color: #f0e8d8;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder { color: rgba(200,160,80,0.35); font-style: italic; }
  input[type="text"]:focus { border-color: rgba(200,160,80,0.55); }

  .api-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .api-row input { flex: 1; font-size: 13px; font-family: monospace; }

  .btn-generate {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #8B6914, #c8a050, #8B6914);
    background-size: 200%;
    background-position: 0%;
    border: none;
    border-radius: 7px;
    color: #1a1410;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background-position 0.4s, opacity 0.2s;
  }
  .btn-generate:hover:not(:disabled) { background-position: 100%; }
  .btn-generate:disabled { opacity: 0.45; cursor: not-allowed; }

  .error-msg { color: #e08888; font-size: 13px; margin-top: 10px; font-family: monospace; }
  .status-msg { color: #c8a050; font-size: 14px; margin-top: 14px; font-style: italic; }

  /* -- Toolbar -- */
  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    max-width: 820px;
    margin: 0 auto 12px;
  }
  .btn-tool {
    padding: 7px 18px;
    border: 1px solid rgba(200,160,80,0.4);
    border-radius: 6px;
    background: transparent;
    color: #c8a050;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-tool:hover { background: rgba(200,160,80,0.1); }

  /* ==========================================
     THE DOCUMENT
  ========================================== */
  .doc-wrap {
    max-width: 820px;
    margin: 0 auto;
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .doc {
    width: 100%;
    background: #faf7f2;
    color: #2a2a2a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* -- Brand stripe helper -- */
  .stripe { display: flex; height: 7px; flex-shrink: 0; }
  .stripe span { flex: 1; }
  .s1 { background: #8B3A2A; }
  .s2 { background: #8B6813; }
  .s3 { background: #1a3a5c; }
  .s4 { background: #2d5a27; }

  /* -- Gold rule -- */
  .gold-rule { height: 2px; background: #c8a050; flex-shrink: 0; }
  .gold-rule-thin { height: 1px; background: linear-gradient(90deg, transparent 5%, #c8a050 25%, #c8a050 75%, transparent 95%); margin: 0 40px; flex-shrink: 0; }

  /* -- Diamonds -- */
  .diamonds {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 8px 0 4px;
    flex-shrink: 0;
    background: #faf7f2;
  }
  .diamond {
    width: 7px; height: 7px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* -- Header / Footer logo panel -- */
  .logo-panel {
    background: #f5f0dc;
    text-align: center;
    padding: 16px 20px 14px;
    flex-shrink: 0;
  }

  .logo-a4l {
    font-family: 'Parisienne', cursive;
    font-size: clamp(32px, 6vw, 52px);
    color: #6B4C2A;
    line-height: 1;
  }

  .logo-underline {
    width: clamp(80px, 18%, 120px);
    height: 1px;
    background: #c8a050;
    margin: 3px auto 6px;
  }

  .logo-org {
    font-family: 'Cinzel', serif;
    font-size: clamp(6px, 1.1vw, 9.5px);
    letter-spacing: 4px;
    color: #6B4C2A;
    margin-bottom: 5px;
  }

  .logo-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(9px, 1.6vw, 13px);
    color: #6B4C2A;
    margin-bottom: 6px;
  }

  .logo-rule {
    width: clamp(100px, 30%, 180px);
    height: 1px;
    background: #c8a050;
    margin: 0 auto 5px;
  }

  .logo-url {
    font-family: 'Cinzel', serif;
    font-size: clamp(6px, 1vw, 8.5px);
    letter-spacing: 2px;
    color: #a07820;
    font-weight: 600;
  }

  /* -- Title bar -- */
  .title-bar {
    background: #3a2010;
    text-align: center;
    padding: 8px 20px;
    flex-shrink: 0;
  }
  .title-bar-label {
    font-family: 'Cinzel', serif;
    font-size: clamp(5px, 0.9vw, 7.5px);
    letter-spacing: 3px;
    color: #c8a050;
    margin-bottom: 3px;
  }
  .title-bar-book {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(10px, 1.8vw, 15px);
    color: white;
  }

  /* -- Content body -- */
  .doc-body {
    padding: 14px 44px 10px;
    flex: 1;
  }

  /* One liner */
  .one-liner-box {
    background: #ede0c4;
    border: 1px solid #8B6813;
    border-radius: 5px;
    text-align: center;
    padding: 7px 16px;
    margin-bottom: 12px;
  }
  .one-liner-box p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(9px, 1.6vw, 12.5px);
    color: #3a2010;
  }

  /* Section label */
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .section-label span {
    font-family: 'Cinzel', serif;
    font-size: clamp(5px, 0.85vw, 7.5px);
    letter-spacing: 3px;
    color: #8B6813;
    white-space: nowrap;
  }
  .section-rule { flex: 1; height: 1px; background: #c8a050; opacity: 0.5; }

  /* Quote block */
  .quote-block {
    background: #3a2010;
    border-radius: 7px;
    padding: 14px 18px 12px 22px;
    margin-bottom: 12px;
    position: relative;
    border-left: 5px solid #c8a050;
  }
  .quote-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 42px);
    color: #c8a050;
    line-height: 0.5;
    display: block;
    margin-bottom: 4px;
  }
  .quote-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(9px, 1.6vw, 12px);
    color: white;
    line-height: 1.55;
  }
  .quote-attr {
    font-family: 'Cinzel', serif;
    font-size: clamp(6px, 0.9vw, 8px);
    color: #c8a050;
    text-align: right;
    margin-top: 6px;
  }

  /* Gradient divider */
  .grad-rule {
    height: 1px;
    background: linear-gradient(90deg, transparent 5%, #c8a050 30%, #c8a050 70%, transparent 95%);
    margin: 10px 0;
    opacity: 0.7;
  }

  /* Takeaway cards */
  .cards-grid {
    display: grid;
    gap: 8px;
    margin-bottom: 10px;
  }

  .card {
    background: #f8f4ea;
    border-radius: 6px;
    overflow: hidden;
  }

  .card-band {
    padding: 8px 12px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-icon { font-size: clamp(14px, 2.2vw, 18px); flex-shrink: 0; }
  .card-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(6px, 1vw, 8.5px);
    letter-spacing: 0.5px;
    color: white;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-body { padding: 8px 12px 4px; }
  .card-point {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(8px, 1.3vw, 11px);
    color: #2a2a2a;
    line-height: 1.5;
    margin-bottom: 5px;
  }
  .card-divider { height: 1px; margin: 0 0 5px; opacity: 0.5; }
  .card-ask {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(7px, 1.1vw, 10px);
    line-height: 1.4;
    padding-bottom: 7px;
  }

  /* -- Footer legal -- */
  .footer-legal {
    background: #f5f0dc;
    border-top: 1px solid #c8a050;
    padding: 5px 40px 6px;
    text-align: center;
  }
  .footer-legal p {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(5px, 0.85vw, 7px);
    color: #7a7060;
    line-height: 1.5;
  }
  .footer-contact {
    background: #f5f0dc;
    text-align: center;
    padding: 4px 40px 6px;
    border-top: 1px solid rgba(200,160,80,0.3);
  }
  .footer-contact p {
    font-family: "Cinzel", serif;
    font-size: clamp(5px, 0.9vw, 8px);
    color: #6B4C2A;
    letter-spacing: 1px;
    line-height: 1.8;
  }

  /* -- Print styles -- */
  @media print {
    @page { size: letter portrait; margin: 0; }
    body { background: white; padding: 0; margin: 0; }
    .control-panel, .toolbar { display: none !important; }
    .doc-wrap { max-width: 100%; margin: 0; }
    .doc { box-shadow: none; border-radius: 0; }
    /* Scale entire doc to fit exactly one page */
    .doc {
      width: 8.5in;
      min-height: 11in;
      max-height: 11in;
      overflow: hidden;
      transform-origin: top left;
    }
    /* Tighten all spacing for print */
    .logo-panel { padding: 10px 20px 8px !important; }
    .logo-a4l { font-size: 36px !important; }
    .doc-body { padding: 8px 36px 6px !important; }
    .one-liner-box { padding: 5px 12px !important; margin-bottom: 7px !important; }
    .quote-block { padding: 10px 14px 8px 18px !important; margin-bottom: 7px !important; }
    .quote-mark { font-size: 28px !important; }
    .grad-rule { margin: 6px 0 !important; }
    .cards-grid { gap: 5px !important; margin-bottom: 6px !important; }
    .card-band { padding: 5px 8px 4px !important; }
    .card-body { padding: 5px 8px 3px !important; }
    .footer-legal { padding: 3px 30px 4px !important; }
    .diamonds { padding: 4px 0 2px !important; }
    .stripe { height: 5px !important; }
  }
</style>
</head>
<body>

<!-- -- Control Panel -- -->
<div class="control-panel">
  <div class="app-logo">A4L</div>
  <div class="app-org">ABIDING FOR LIFE</div>
  <div class="app-tagline">Rest for the Soul. Healing for the Journey.</div>
  <div class="gold-line"></div>

  <div class="input-card">
    <h2>SOUL AWAKENING GUIDE GENERATOR</h2>

    <div class="api-row">
      <input type="text" id="apiKey" placeholder="Paste your Anthropic API key here" />
    </div>

    <div class="input-row">
      <input type="text" id="bookTitle" placeholder="Book Title" />
      <input type="text" id="bookAuthor" placeholder="Author Name" />
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generate()">GENERATE GUIDE</button>
    <div id="statusMsg" class="status-msg" style="display:none"></div>
    <div id="errorMsg" class="error-msg" style="display:none"></div>
  </div>
</div>

<!-- -- Toolbar -- -->
<div class="toolbar" id="toolbar" style="display:none">
  <button class="btn-tool" onclick="resetForm()">NEW BOOK</button>
  <button class="btn-tool" onclick="savePDF()">PRINT / SAVE PDF</button>
</div>

<!-- -- Document Preview -- -->
<div class="doc-wrap" id="docWrap" style="display:none">
  <div class="doc" id="doc"></div>
</div>

<script>
const SYSTEM_PROMPT = `You are a pastoral content writer for A4L -- Abiding for Life.

Voice: Warm but not soft. Direct but not harsh. Spiritual but not cliche. Write like a shepherd, not a marketer. Short, powerful statements. Grace-filled, unhurried. Speak identity. Invite rather than pressure.

Core phrases to draw from: "Find healing. Begin again. Restore the soul." / "God meets you where you are." / "You are not behind." / "Grace is not earned." / "Fear shrinks vision. Love expands it."

Given a book title and author, generate a Soul Awakening Guide. Return ONLY a valid JSON object -- no markdown, no code fences, no explanation. Raw JSON only.

Format:
{
  "one_liner": "The whole book in one punchy memorable sentence",
  "big_quote": "A powerful quote or paraphrase from the book -- 1-2 sentences max",
  "quote_attr": "-- Author Name",
  "takeaways": [
    {
      "icon": "emoji",
      "title": "Short punchy title -- 4-6 words",
      "point": "Plain English explanation -- 2-3 sentences. Warm, direct, memorable. No jargon.",
      "ask": "A personal reflection question that moves it from head to heart to life"
    }
  ]
}

Rules:
- Generate 6 takeaways -- always exactly 6, no more no less
- Each takeaway title: 4-7 words, punchy and memorable
- point: EXACTLY 3 full sentences. Warm, plain English, like explaining to a friend over coffee. No fragments.
- ask: One full warm reflection question -- not a fragment
- one_liner: One complete punchy sentence a reader could repeat to a friend
- big_quote: 2 full sentences capturing the heart of the book
- The reflection question should feel personal and gentle, not guilt-inducing
- No religious cliches
- IMPORTANT: Write rich, full sentences throughout. The goal is a page that feels substantial and worth keeping.`;

const BRAND_COLORS = ['#8B3A2A','#8B6813','#1a3a5c','#2d5a27'];

function stripe(reverse=false) {
  const cols = reverse ? [...BRAND_COLORS].reverse() : BRAND_COLORS;
  return `<div class="stripe">${cols.map(c=>`<span style="background:${c}"></span>`).join('')}</div>`;
}

function diamonds() {
  const cols = [...BRAND_COLORS,...BRAND_COLORS,...BRAND_COLORS];
  return `<div class="diamonds">${cols.slice(0,11).map((c,i)=>`<div class="diamond" style="background:${BRAND_COLORS[i%4]}"></div>`).join('')}</div>`;
}

function sectionLabel(text) {
  return `<div class="section-label"><div class="section-rule"></div><span>${text}</span><div class="section-rule"></div></div>`;
}

function logoPanel(showUrl=false) {
  return `
    <div class="logo-panel">
      <div class="logo-a4l">A4L</div>
      <div class="logo-underline"></div>
      <div class="logo-org">ABIDING &nbsp; FOR &nbsp; LIFE</div>
      <div class="logo-tagline">Rest for the Soul. Healing for the Journey.</div>
      <div class="logo-rule"></div>
      ${showUrl ? `<div class="logo-url">ABIDING4LIFE.COM</div>` : ''}
    </div>`;
}

function renderCards(takeaways) {
  // Determine grid columns based on count
  const n = takeaways.length;
  const cols = n <= 3 ? n : Math.ceil(n/2);
  const gridCols = `repeat(${Math.min(cols, 4)}, 1fr)`;

  return `<div class="cards-grid" style="grid-template-columns:${gridCols}">
    ${takeaways.map((t, i) => {
      const col = BRAND_COLORS[i % BRAND_COLORS.length];
      return `
        <div class="card">
          <div class="card-band" style="background:${col}">
            <span class="card-icon">${t.icon}</span>
            <span class="card-title">${t.title}</span>
          </div>
          <div class="card-body">
            <p class="card-point">${t.point}</p>
            <div class="card-divider" style="background:${col}"></div>
            <p class="card-ask" style="color:${col}">? ${t.ask}</p>
          </div>
        </div>`;
    }).join('')}
  </div>`;
}

function buildDoc(data, title, author) {
  return `
    ${stripe()}
    <div class="gold-rule"></div>
    ${logoPanel(false)}
    <div class="gold-rule"></div>
    ${stripe(true)}
    ${diamonds()}

    <div class="title-bar">
      <div class="title-bar-label">A &nbsp; S O U L &nbsp; A W A K E N I N G &nbsp; G U I D E</div>
      <div class="title-bar-book"><em>${title}</em> &nbsp;-&nbsp; ${author}</div>
    </div>

    <div class="doc-body">
      <div class="one-liner-box">
        <p>&ldquo;${data.one_liner}&rdquo;</p>
      </div>

      <div class="grad-rule"></div>
      ${sectionLabel('W O R D S &nbsp; T H A T &nbsp; S T I C K')}
      <div class="quote-block">
        <span class="quote-mark">&ldquo;</span>
        <p class="quote-text">${data.big_quote}</p>
        <p class="quote-attr">${data.quote_attr}</p>
      </div>

      <div class="grad-rule"></div>
      ${sectionLabel('W H A T &nbsp; T O &nbsp; R E M E M B E R &nbsp; &amp; &nbsp; L I V E')}
      ${renderCards(data.takeaways)}
    </div>

    ${diamonds()}
    ${stripe(true)}
    <div class="gold-rule"></div>
    ${logoPanel(true)}
    <div class="gold-rule"></div>
    ${stripe()}

    <div class="footer-contact">
      <p>John Oelze &nbsp;|&nbsp; 231-360-5863 &nbsp;|&nbsp; johnoelze@gmail.com &nbsp;&nbsp;&nbsp; Linda Oelze &nbsp;|&nbsp; 231-360-8104 &nbsp;|&nbsp; linda.oelze@gmail.com</p>
    </div>
    <div class="footer-contact">
      <p>John Oelze &nbsp;|&nbsp; 231-360-5863 &nbsp;|&nbsp; johnoelze@gmail.com &nbsp;&nbsp;&nbsp;&nbsp; Linda Oelze &nbsp;|&nbsp; 231-360-8104 &nbsp;|&nbsp; linda.oelze@gmail.com</p>
    </div>
    <div class="footer-legal">
      <p>For personal and ministry use only. This is an AI-assisted reading guide curated by A4L - Abiding for Life. It is not an official publication of the author or publisher, and is not intended as a substitute for reading the original work. All intellectual property rights remain with the respective copyright holders. We encourage you to purchase and read the full book. Publishers or authors may request removal at abiding4life.com.</p>
    </div>`;
}

async function generate() {
  const apiKey   = document.getElementById('apiKey').value.trim();
  const title    = document.getElementById('bookTitle').value.trim();
  const author   = document.getElementById('bookAuthor').value.trim();
  const btn      = document.getElementById('generateBtn');
  const status   = document.getElementById('statusMsg');
  const errDiv   = document.getElementById('errorMsg');

  errDiv.style.display = 'none';
  errDiv.textContent = '';

  if (!apiKey) { showError('Please paste your Anthropic API key.'); return; }
  if (!title)  { showError('Please enter a book title.'); return; }
  if (!author) { showError('Please enter the author name.'); return; }

  btn.disabled = true;
  status.style.display = 'block';
  status.textContent = `Abiding in the text of "${title}"...`;

  document.getElementById('docWrap').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1500,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: `Book: "${title}" by ${author}` }]
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result?.error?.message || `API error ${response.status}`);
    }

    const raw   = result.content.map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const data  = JSON.parse(clean);

    document.getElementById('doc').innerHTML = buildDoc(data, title, author);
    document.getElementById('docWrap').style.display = 'block';
    document.getElementById('toolbar').style.display = 'flex';
    status.style.display = 'none';

  } catch(e) {
    showError(e.message || 'Something went wrong. Please try again.');
    status.style.display = 'none';
  } finally {
    btn.disabled = false;
  }
}

function showError(msg) {
  const errDiv = document.getElementById('errorMsg');
  errDiv.textContent = msg;
  errDiv.style.display = 'block';
}

function resetForm() {
  document.getElementById('bookTitle').value = '';
  document.getElementById('bookAuthor').value = '';
  document.getElementById('docWrap').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('bookTitle').focus();
}

// Allow Enter key to trigger generate
function savePDF() {
  const t = document.getElementById('bookTitle').value.trim();
