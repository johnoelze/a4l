<style>
  /* -- Reset -- */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* -- App Shell -- */
  body {
    font-family: 'General Sans', 'Helvetica Neue', sans-serif;
    background: #E7EEF2;
    min-height: 100vh;
    padding: 32px 16px 60px;
    color: #282828;
  }

  /* -- Control Panel -- */
  .control-panel {
    max-width: 620px;
    margin: 0 auto 36px;
    text-align: center;
  }

  .app-logo {
    font-family: 'The Seasons', serif;
    font-size: 52px;
    color: #A6B8C1;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(166,184,193,0.3);
  }

  .app-org {
    font-family: 'General Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    color: #5F6D82;
    margin-top: 4px;
  }

  .app-tagline {
    font-family: 'The Seasons', serif;
    font-style: italic;
    font-size: 15px;
    color: #1B365D;
    margin-top: 5px;
  }

  .gold-line {
    width: 220px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #A6B8C1, transparent);
    margin: 14px auto;
  }

  .input-card {
    background: #FFFFFF;
    border: 1px solid #AEA8A5;
    border-radius: 12px;
    padding: 24px 28px;
    margin-top: 20px;
  }

  .input-card h2 {
    font-family: 'General Sans', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    color: #1B365D;
    margin-bottom: 18px;
  }

  .input-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

  input[type="text"] {
    background: #FFFFFF;
    border: 1px solid #AEA8A5;
    border-radius: 7px;
    padding: 11px 15px;
    color: #282828;
    font-family: 'General Sans', sans-serif;
    font-size: 17px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  input[type="text"]::placeholder { color: #AEA8A5; font-style: italic; }
  input[type="text"]:focus { border-color: #5F6D82; }

  .api-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .api-row input { flex: 1; font-size: 13px; font-family: monospace; }

  .btn-generate {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #1B365D, #5F6D82, #1B365D);
    background-size: 200%;
    background-position: 0%;
    border: none;
    border-radius: 7px;
    color: #FFFFFF;
    font-family: 'General Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background-position 0.4s, opacity 0.2s;
  }
  .btn-generate:hover:not(:disabled) { background-position: 100%; }
  .btn-generate:disabled { opacity: 0.45; cursor: not-allowed; }

  .error-msg { color: #282828; font-size: 13px; margin-top: 10px; font-family: monospace; }
  .status-msg { color: #1B365D; font-size: 14px; margin-top: 14px; font-style: italic; }

  /* -- Toolbar -- */
  .toolbar {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    max-width: 820px;
    margin: 0 auto 12px;
  }
  .btn-tool {
    padding: 7px 18px;
    border: 1px solid rgba(166,184,193,0.4);
    border-radius: 6px;
    background: transparent;
    color: #A6B8C1;
    font-family: 'General Sans', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-tool:hover { background: #DDDCDB; }

  /* ==========================================
     THE DOCUMENT
  ========================================== */
  .doc-wrap {
    max-width: 820px;
    margin: 0 auto;
    animation: fadeUp 0.5s ease;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

  .doc {
    width: 100%;
    background: #FFFFFF;
    color: #282828;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border-radius: 3px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* -- Brand stripe helper -- */
  .stripe { display: flex; height: 7px; flex-shrink: 0; }
  .stripe span { flex: 1; }
  .s1 { background: #1B365D; }
  .s2 { background: #5F6D82; }
  .s3 { background: #1B365D; }
  .s4 { background: #5F6D82; }

  /* -- Gold rule -- */
  .gold-rule { height: 2px; background: #A6B8C1; flex-shrink: 0; }
  .gold-rule-thin { height: 1px; background: linear-gradient(90deg, transparent 5%, #A6B8C1 25%, #A6B8C1 75%, transparent 95%); margin: 0 40px; flex-shrink: 0; }

  /* -- Diamonds -- */
  .diamonds {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 8px 0 4px;
    flex-shrink: 0;
    background: #FFFFFF;
  }
  .diamond {
    width: 7px; height: 7px;
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* -- Header / Footer logo panel -- */
  .logo-panel {
    background: #E7EEF2;
    text-align: center;
    padding: 16px 20px 14px;
    flex-shrink: 0;
  }

  .logo-a4l {
    font-family: 'The Seasons', serif;
    font-size: 52px;
    color: #1B365D;
    line-height: 1;
  }

  .logo-underline {
    width: 120px;
    height: 1px;
    background: #A6B8C1;
    margin: 3px auto 6px;
  }

  .logo-org {
    font-family: 'General Sans', sans-serif;
    font-size: 9.5px;
    letter-spacing: 4px;
    color: #1B365D;
    margin-bottom: 5px;
  }

  .logo-tagline {
    font-family: 'The Seasons', serif;
    font-style: italic;
    font-size: 13px;
    color: #1B365D;
    margin-bottom: 6px;
  }

  .logo-rule {
    width: 180px;
    height: 1px;
    background: #A6B8C1;
    margin: 0 auto 5px;
  }

  .logo-url {
    font-family: 'General Sans', sans-serif;
    font-size: 8.5px;
    letter-spacing: 2px;
    color: #5F6D82;
    font-weight: 600;
  }

  /* -- Title bar -- */
  .title-bar {
    background: #1B365D;
    text-align: center;
    padding: 8px 20px;
    flex-shrink: 0;
  }
  .title-bar-label {
    font-family: 'General Sans', sans-serif;
    font-size: 7.5px;
    letter-spacing: 3px;
    color: #A6B8C1;
    margin-bottom: 3px;
  }
  .title-bar-book {
    font-family: 'The Seasons', serif;
    font-style: italic;
    font-size: 15px;
    color: #FFFFFF;
  }

  /* -- Content body -- */
  .doc-body {
    padding: 14px 44px 10px;
    flex: 1;
  }

  /* One liner */
  .one-liner-box {
    background: #E7EEF2;
    border: 1px solid #5F6D82;
    border-radius: 5px;
    text-align: center;
    padding: 7px 16px;
    margin-bottom: 12px;
  }
  .one-liner-box p {
    font-family: 'The Seasons', serif;
    font-style: italic;
    font-size: 12.5px;
    color: #1B365D;
  }

  /* Section label */
  .section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .section-label span {
    font-family: 'General Sans', sans-serif;
    font-size: 7.5px;
    letter-spacing: 3px;
    color: #5F6D82;
    white-space: nowrap;
  }
  .section-rule { flex: 1; height: 1px; background: #A6B8C1; opacity: 0.5; }

  /* Quote block */
  .quote-block {
    background: #1B365D;
    border-radius: 7px;
    padding: 14px 18px 12px 22px;
    margin-bottom: 12px;
    position: relative;
    border-left: 5px solid #A6B8C1;
  }
  .quote-mark {
    font-family: 'The Seasons', serif;
    font-size: 42px;
    color: #A6B8C1;
    line-height: 0.5;
    display: block;
    margin-bottom: 4px;
  }
  .quote-text {
    font-family: 'The Seasons', serif;
    font-style: italic;
    font-size: 12px;
    color: #FFFFFF;
    line-height: 1.55;
  }
  .quote-attr {
    font-family: 'General Sans', sans-serif;
    font-size: 8px;
    color: #A6B8C1;
    text-align: right;
    margin-top: 6px;
  }

  /* Gradient divider */
  .grad-rule {
    height: 1px;
    background: linear-gradient(90deg, transparent 5%, #A6B8C1 30%, #A6B8C1 70%, transparent 95%);
    margin: 10px 0;
    opacity: 0.7;
  }

  /* Takeaway cards */
  .cards-grid {
    display: grid;
    gap: 8px;
    margin-bottom: 10px;
  }

  .card {
    background: #E7EEF2;
    border-radius: 6px;
    overflow: hidden;
  }

  .card-band {
    padding: 8px 12px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-icon { font-size: 18px; flex-shrink: 0; }
  .card-title {
    font-family: 'General Sans', sans-serif;
    font-size: 8.5px;
    letter-spacing: 0.5px;
    color: #FFFFFF;
    font-weight: 600;
    line-height: 1.3;
  }

  .card-body { padding: 8px 12px 4px; }
  .card-point {
    font-family: 'The Seasons', serif;
    font-size: 11px;
    color: #282828;
    line-height: 1.5;
    margin-bottom: 5px;
  }
  .card-divider { height: 1px; margin: 0 0 5px; opacity: 0.5; }
  .card-ask {
    font-family: 'The Seasons', serif;
    font-style: italic;
    font-size: 10px;
    line-height: 1.4;
    padding-bottom: 7px;
  }

  /* -- Footer legal -- */
  .footer-legal {
    background: #E7EEF2;
    border-top: 1px solid #A6B8C1;
    padding: 5px 40px 6px;
    text-align: center;
  }
  .footer-legal p {
    font-family: 'The Seasons', serif;
    font-size: 7.5px;
    color: #AEA8A5;
    line-height: 1.5;
  }
  .footer-contact {
    background: #E7EEF2;
    text-align: center;
    padding: 4px 40px 6px;
    border-top: 1px solid rgba(166,184,193,0.3);
  }
  .footer-contact p {
    font-family: 'General Sans', sans-serif;
    font-size: 11px;
    color: #1B365D;
    letter-spacing: 1px;
    line-height: 1.8;
  }


  /* -- Brand Toggle -- */
  .brand-toggle {
    display: flex;
    justify-content: center;
    gap: 0;
    margin: 0 auto 20px;
    max-width: 320px;
    border: 1px solid rgba(166,184,193,0.3);
    border-radius: 8px;
    overflow: hidden;
  }
  .brand-btn {
    flex: 1;
    padding: 12px 8px;
    background: transparent;
    border: none;
    color: #AEA8A5;
    font-family: 'General Sans', sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .brand-btn.active-a4l {
    background: linear-gradient(135deg, #5F6D82, #A6B8C1);
    color: #282828;
  }
  .brand-btn.active-ssm {
    background: linear-gradient(135deg, #1B365D, #5F6D82);
    color: #fff;
  }

  /* -- SSM logo panel variant -- */
  .logo-panel.ssm { background: #E7EEF2; }
  .logo-ssm-wordmark {
    font-family: 'The Seasons', serif;
    font-weight: 600;
    font-size: 58px;
    color: #1B365D;
    line-height: 1;
    letter-spacing: 0.5px;
  }
  .logo-ssm-sub {
    font-family: 'General Sans', 'Helvetica Neue', sans-serif;
    font-size: 9.5px;
    letter-spacing: 5px;
    color: #5F6D82;
    margin-top: 4px;
  }
  .logo-ssm-img {
    display: block;
    width: 190px;
    height: auto;
    margin: 0 auto 4px;
  }
  .logo-ssm-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .logo-ssm-icon {
    display: block;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
  }
  .logo-ssm-icon svg { width: 100%; height: 100%; display: block; }
  .logo-ssm-tagline {
    font-family: 'The Seasons', serif;
    font-style: italic;
    font-size: 13px;
    color: #1B365D;
    margin-top: 6px;
  }
  .logo-ssm-rule {
    width: 180px;
    height: 1px;
    background: #5F6D82;
    margin: 6px auto 5px;
  }
  .logo-ssm-url {
    font-family: 'General Sans', 'Helvetica Neue', sans-serif;
    font-size: 8.5px;
    letter-spacing: 2px;
    color: #5F6D82;
    font-weight: 600;
  }


  /* SSM typography overrides (applied when doc built for ssm) */
  .doc.brand-ssm .title-bar-book { font-family: 'The Seasons', serif; }
  .doc.brand-ssm .one-liner-box p,
  .doc.brand-ssm .quote-text { font-family: 'General Sans', 'Helvetica Neue', sans-serif; font-style: italic; }
  .doc.brand-ssm .card-title,
  .doc.brand-ssm .section-label span,
  .doc.brand-ssm .title-bar-label { font-family: 'General Sans', 'Helvetica Neue', sans-serif; letter-spacing: 1.5px; }
  .doc.brand-ssm .card-point,
  .doc.brand-ssm .card-ask,
  .doc.brand-ssm .footer-contact p { font-family: 'General Sans', 'Helvetica Neue', sans-serif; }
  /* -- Print styles -- */
  @media print {
    @page { size: letter portrait; margin: 0.2in; }
    body { background: #FFFFFF !important; padding: 0 !important; margin: 0 !important; }
    .control-panel, .toolbar { display: none !important; }
    .doc-wrap { max-width: 100% !important; margin: 0 !important; }
    .doc { box-shadow: none !important; border-radius: 0 !important; }

    /* Readable print typography - fills the letter page */
    .cards-grid { gap: 8px !important; margin-bottom: 8px !important; }

    .logo-panel { padding: 10px 20px 8px !important; }
    .logo-a4l { font-size: 34px !important; }
    .logo-ssm-img { width: 130px !important; margin-bottom: 3px !important; }
    
    .logo-ssm-img {
    display: block;
    width: 190px;
    height: auto;
    margin: 0 auto 4px;
  }
  
    .logo-org, 
    .logo-tagline, .logo-ssm-tagline { font-size: 11px !important; }
    .title-bar { padding: 8px 20px !important; }
    .title-bar-label { font-size: 8px !important; }
    .title-bar-book { font-size: 16px !important; }
    .doc-body { padding: 10px 32px 8px !important; }
    .one-liner-box { padding: 7px 14px !important; margin-bottom: 9px !important; }
    .one-liner-box p { font-size: 13.5px !important; }
    .section-label { margin-bottom: 8px !important; }
    .section-label span { font-size: 9px !important; }
    .quote-block { padding: 11px 16px 9px 20px !important; margin-bottom: 9px !important; }
    .quote-mark { font-size: 30px !important; margin-bottom: 3px !important; }
    .quote-text { font-size: 13.5px !important; line-height: 1.5 !important; }
    .quote-attr { font-size: 10px !important; }
    .grad-rule { margin: 7px 0 !important; }
    .card-band { padding: 6px 10px 5px !important; }
    .card-icon { font-size: 17px !important; }
    .card-title { font-size: 10.5px !important; }
    .card-point { font-size: 11px !important; line-height: 1.45 !important; margin-bottom: 6px !important; }
    .card-ask { font-size: 10px !important; line-height: 1.4 !important; padding-bottom: 7px !important; }
    .card-body { padding: 6px 10px 4px !important; }
    .footer-contact { padding: 4px 30px 4px !important; }
    .footer-contact p { font-size: 10px !important; }
    .footer-legal { padding: 4px 28px 5px !important; }
    .footer-legal p { font-size: 6.5px !important; line-height: 1.4 !important; }
    .diamonds { padding: 4px 0 3px !important; }

    .doc { page-break-inside: avoid !important; break-inside: avoid !important; }
  }
</style>
</head>

function stripe(brand, reverse=false) {
  const cols = reverse ? [...brand.stripeColors].reverse() : brand.stripeColors;
  return `<div class="stripe">${cols.map(c=>`<span style="background:${c}"></span>`).join('')}</div>`;
}

function diamonds(brand) {
  return `<div class="diamonds">${Array.from({length:11}).map((_,i)=>`<div class="diamond" style="background:${brand.stripeColors[i%4]}"></div>`).join('')}</div>`;
}

function sectionLabel(text, brand) {
  return `<div class="section-label"><div class="section-rule" style="background:${brand.ruleColor}"></div><span style="color:${brand.sectionColor}">${text}</span><div class="section-rule" style="background:${brand.ruleColor}"></div></div>`;
}

function logoPanel(brand, brandKey, showUrl=false) {
  if (brandKey === 'ssm') {
    return `
    <div class="logo-panel ssm">
      <img class="logo-ssm-img" src="${SSM_LOGO_B64}" alt="Standing Stone Ministries Inc." />
      <div class="logo-ssm-tagline">${brand.tagline}</div>
      <div class="logo-ssm-rule"></div>
      ${showUrl ? `<div class="logo-ssm-url">${brand.url}</div>` : ''}
    </div>`;
  }
  return `
    <div class="logo-panel">
      <div class="logo-a4l">A4L</div>
      <div class="logo-underline"></div>
      <div class="logo-org">ABIDING &nbsp; FOR &nbsp; LIFE</div>
      <div class="logo-tagline">Rest for the Soul. Healing for the Journey.</div>
      <div class="logo-rule"></div>
      ${showUrl ? `<div class="logo-url">${brand.url}</div>` : ''}
    </div>`;
}

function renderCards(takeaways, brand) {
  return `<div class="cards-grid" style="grid-template-columns:repeat(3, 1fr)">
    ${takeaways.map((t, i) => {
      const col = brand.cardColors[i % brand.cardColors.length];
      return `
        <div class="card">
          <div class="card-band" style="background:${col}">
            <span class="card-icon">${t.icon}</span>
            <span class="card-title">${t.title}</span>
          </div>
          <div class="card-body">
            <p class="card-point">${t.point}</p>
            <div class="card-divider" style="background:${col}"></div>
            <p class="card-ask" style="color:${col}">? ${t.ask}</p>
          </div>
        </div>`;
    }).join('')}
  </div>`;
}

function buildDoc(data, title, author, brandKey) {
  const brand = BRANDS[brandKey];
  return `
    ${stripe(brand)}
    <div class="gold-rule" style="background:${brand.ruleColor}"></div>
    ${logoPanel(brand, brandKey, false)}
    <div class="gold-rule" style="background:${brand.ruleColor}"></div>
    ${stripe(brand, true)}
    ${diamonds(brand)}

    <div class="title-bar" style="background:${brand.titleBarBg}">
      <div class="title-bar-label" style="color:${brand.titleBarLabel}">${brand.guideLabel}</div>
      <div class="title-bar-book"><em>${title}</em> &nbsp;-&nbsp; ${author}</div>
    </div>

    <div class="doc-body">
      <div class="one-liner-box" style="background:${brand.oneLinerBg};border-color:${brand.oneLinerBorder}">
        <p style="color:${brand.oneLinerText}">&ldquo;${data.one_liner}&rdquo;</p>
      </div>

      <div class="grad-rule" style="background:linear-gradient(90deg, transparent 5%, ${brand.ruleColor} 30%, ${brand.ruleColor} 70%, transparent 95%)"></div>
      ${sectionLabel('W O R D S &nbsp; T H A T &nbsp; S T I C K', brand)}
      <div class="quote-block" style="background:${brand.quoteBg};border-left-color:${brand.quoteAccent}">
        <span class="quote-mark" style="color:${brand.quoteAccent}">&ldquo;</span>
        <p class="quote-text">${data.big_quote}</p>
        <p class="quote-attr" style="color:${brand.quoteAccent}">${data.quote_attr}</p>
      </div>

      <div class="grad-rule" style="background:linear-gradient(90deg, transparent 5%, ${brand.ruleColor} 30%, ${brand.ruleColor} 70%, transparent 95%)"></div>
      ${sectionLabel('W H A T &nbsp; T O &nbsp; R E M E M B E R &nbsp; &amp; &nbsp; L I V E', brand)}
      ${renderCards(data.takeaways, brand)}
    </div>

    ${diamonds(brand)}
    ${stripe(brand, true)}
    <div class="gold-rule" style="background:${brand.ruleColor}"></div>
    ${logoPanel(brand, brandKey, true)}
    <div class="gold-rule" style="background:${brand.ruleColor}"></div>
    ${stripe(brand)}

    <div class="footer-contact" style="background:${brand.panelBg}">
      <p style="color:${brand.oneLinerText}">${brand.contact}</p>
    </div>
    <div class="footer-legal" style="background:${brand.panelBg};border-top-color:${brand.ruleColor}">
      <p>${brand.footerLegal}</p>
    </div>`;
}

async function generate() {
  const apiKey   = document.getElementById('apiKey').value.trim();
  const title    = document.getElementById('bookTitle').value.trim();
  const author   = document.getElementById('bookAuthor').value.trim();
  const btn      = document.getElementById('generateBtn');
  const status   = document.getElementById('statusMsg');
  const errDiv   = document.getElementById('errorMsg');
  const brand    = BRANDS[currentBrand];

  errDiv.style.display = 'none';
  errDiv.textContent = '';

  if (!apiKey) { showError('Please paste your Anthropic API key.'); return; }
  if (!title)  { showError('Please enter a book title.'); return; }
  if (!author) { showError('Please enter the author name.'); return; }

  btn.disabled = true;
  status.style.display = 'block';
  status.textContent = `${brand.statusVerb} "${title}"...`;

  document.getElementById('docWrap').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1500,
        system: brand.systemPrompt + JSON_FORMAT,
        messages: [{ role: 'user', content: `Book: "${title}" by ${author}` }]
      })
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result?.error?.message || `API error ${response.status}`);
    }

    const raw   = result.content.map(b => b.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const data  = JSON.parse(clean);

    const docEl = document.getElementById('doc');
    docEl.className = 'doc brand-' + currentBrand;
    docEl.innerHTML = buildDoc(data, title, author, currentBrand);
    document.getElementById('docWrap').style.display = 'block';
    document.getElementById('toolbar').style.display = 'flex';
    status.style.display = 'none';

  } catch(e) {
    showError(e.message || 'Something went wrong. Please try again.');
    status.style.display = 'none';
  } finally {
    btn.disabled = false;
  }
}

function showError(msg) {
  const errDiv = document.getElementById('errorMsg');
  errDiv.textContent = msg;
  errDiv.style.display = 'block';
}

function resetForm() {
  document.getElementById('bookTitle').value = '';
  document.getElementById('bookAuthor').value = '';
  document.getElementById('docWrap').style.display = 'none';
  document.getElementById('toolbar').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('bookTitle').focus();
}

function savePDF() {
  const t = document.getElementById('bookTitle').value.trim();
  const a = document.getElementById('bookAuthor').value.trim();
  const brand = BRANDS[currentBrand];
  if (t && a) {
    document.title = t + ' by ' + a + ' -- ' + brand.pdfSuffix;
  }
  window.print();
  setTimeout(() => { document.title = 'Book Summary Generator'; }, 2000);
}

window.addEventListener('load', () => setBrand('ssm'));

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') generate();
});
</script>
</body>
</html>
